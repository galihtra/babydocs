  <div id="app">Memuat dokumentasi…</div>

  <script>
    window.$docsify = {
      name: "{{PROJECT_NAME}}",
      repo: "{{REPO_URL}}",
      loadSidebar: true,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      relativePath: false,
      homepage: "README.md",
      // Semua halaman memakai satu _sidebar.md di root
      alias: {
        "/.*/_sidebar.md": "/_sidebar.md"
      },
      notFoundPage: true,

      // Plugin: Search
      search: {
        maxAge: 86400000,
        paths: "auto",
        placeholder: "🔍 Cari…",
        noData: "Tidak ditemukan 😢",
        depth: 3,
        hideOtherSidebarContent: false
      },

      // Plugin: Copy Code
      copyCode: {
        buttonText: "Salin",
        errorText: "Gagal",
        successText: "Tersalin ✓"
      },

      // Ubah blok ```mermaid menjadi diagram
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === "mermaid") {
              var escaped = String(code)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
              return '<div class="mermaid">' + escaped + "</div>";
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },

      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (!window.mermaid) return;
            var nodes = document.querySelectorAll(".markdown-section .mermaid:not([data-processed])");
            if (nodes.length) {
              window.mermaid.run({ nodes: nodes }).catch(function (err) {
                console.error("Mermaid error:", err);
              });
            }
          });
        }
      ]
    };
  </script>
